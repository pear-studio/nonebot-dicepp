name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test-suite.yml

  windows-portable:
    name: Build Windows Portable
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.11.16"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Build and smoke test Portable
        shell: pwsh
        run: |
          uv run pyinstaller scripts/build/dicepp.spec --clean --noconfirm
          uv run pyinstaller scripts/build/dashboard.spec --clean --noconfirm
          ./scripts/build/assemble_windows_package.ps1
          $version = [regex]::Match((Get-Content pyproject.toml | Select-String '^version =').Line, '"([^"\r\n]+)"').Groups[1].Value
          if ((& dist/DicePP/DicePP-Runtime.exe --version) -ne "DicePP v$version") { throw "Runtime version mismatch" }
          & dist/DicePP/DicePP-Runtime.exe --smoke-check
          $dashboard = Start-Process -FilePath "dist/DicePP/DicePP.exe" -ArgumentList "--smoke-check" -Wait -PassThru
          if ($dashboard.ExitCode -ne 0) { throw "Dashboard smoke check failed" }
          Compress-Archive -Path dist/DicePP -DestinationPath "DicePP-${{ github.ref_name }}-win64-Portable.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-portable
          path: DicePP-${{ github.ref_name }}-win64-Portable.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: windows-portable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-portable
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.11.16"
      - name: Install dependencies for empty-instance import smoke
        run: uv sync --frozen --group dev
      - name: Test empty-instance import fixture
        run: uv run pytest tests/integration/dashboard/test_instance_data.py -n0 --tb=short -q
      - name: Build and fresh-start the single DicePP image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/pear-studio/nonebot-dicepp:${{ github.ref_name }}
          LATEST_IMAGE: ghcr.io/pear-studio/nonebot-dicepp:latest
        run: |
          expected="$(sed -n 's/^version = \"\(.*\)\"$/\1/p' pyproject.toml)"
          test -n "$expected"
          test "$GITHUB_REF_NAME" = "v$expected"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker_args=(--build-arg "DICEPP_IMAGE_TAG=${{ github.ref_name }}" --build-arg "GIT_SHA=${{ github.sha }}" -t "$IMAGE")
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker_args+=( -t "$LATEST_IMAGE" )
          fi
          docker build "${docker_args[@]}" .
          test "$(docker run --rm --network=none "$IMAGE" python -m dashboard --version)" = "DicePP Dashboard v$expected"
          mkdir -p smoke/{config,data,content,dashboard/data,manager/backups}
          docker run -d --name dicepp-release-smoke -p 127.0.0.1:4090:4090 \
            -e DICEPP_ONEBOT_HOST=0.0.0.0 \
            -v "$PWD/smoke/config:/app/config" \
            -v "$PWD/smoke/data:/app/data" \
            -v "$PWD/smoke/content:/app/content" \
            -v "$PWD/smoke/dashboard/data:/app/dashboard/data" \
            -v "$PWD/smoke/manager/backups:/app/manager/backups" \
            "$IMAGE"
          trap 'docker rm -f dicepp-release-smoke >/dev/null 2>&1 || true' EXIT
          ready=false
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4090/api/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then docker logs dicepp-release-smoke; exit 1; fi
          docker rm -f dicepp-release-smoke >/dev/null
      - name: Prepare release assets
        run: |
          cp docker-compose.yml dist/docker-compose.yml
          (cd dist && sha256sum "DicePP-${{ github.ref_name }}-win64-Portable.zip" docker-compose.yml > checksums.sha256)
      - name: Push the single GHCR image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/pear-studio/nonebot-dicepp:${{ github.ref_name }}
          LATEST_IMAGE: ghcr.io/pear-studio/nonebot-dicepp:latest
        run: |
          docker push "$IMAGE"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker push "$LATEST_IMAGE"
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then
            gh release create "${{ github.ref_name }}" \
              "dist/DicePP-${{ github.ref_name }}-win64-Portable.zip" \
              dist/docker-compose.yml dist/checksums.sha256 \
              --title "${{ github.ref_name }}" --notes-file "$notes" --target "${{ github.sha }}"
          else
            gh release create "${{ github.ref_name }}" \
              "dist/DicePP-${{ github.ref_name }}-win64-Portable.zip" \
              dist/docker-compose.yml dist/checksums.sha256 \
              --title "${{ github.ref_name }}" --generate-notes --target "${{ github.sha }}"
          fi
