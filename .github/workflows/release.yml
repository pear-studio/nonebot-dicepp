# DicePP Release — tag push 触发镜像构建、GHCR 推送、Windows EXE 构建和 GitHub Release 创建
#
# 触发: push v*.*.* tag
# 支持: vX.Y.Z 正式版；vX.Y.ZrcN 预发布测试版
# 产物: ghcr.io/pear-studio/nonebot-dicepp:<tag>
#       ghcr.io/pear-studio/dicepp-dashboard:<tag>；正式版额外推送 :latest
#       DicePP-<tag>-win64.zip
#       DicePP-<tag>-linux-amd64-offline.zip
#       GitHub Release / Prerelease（body 来自 docs/releases/<tag>.md）
#       docker-compose.yml、Windows zip 和 Linux 离线包作为 release assets

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write     # 创建 GitHub Release + 上传 assets
  packages: write     # 推送 GHCR 镜像

jobs:
  quality-gate:
    name: Quality Gate
    uses: ./.github/workflows/test-suite.yml

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Build image (local only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/pear-studio/nonebot-dicepp:${{ steps.version.outputs.tag }}
          build-args: |
            DICEPP_IMAGE_TAG=${{ steps.version.outputs.tag }}
            GIT_SHA=${{ steps.version.outputs.sha }}

      - name: Smoke test image
        run: |
          EXPECTED="DicePP v${{ steps.version.outputs.version }}"
          ACTUAL="$(docker run --rm ghcr.io/pear-studio/nonebot-dicepp:${{ steps.version.outputs.tag }} \
            python bot.py --version)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Version mismatch: expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi

      - name: Build Dashboard image (local only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          load: true
          tags: |
            ghcr.io/pear-studio/dicepp-dashboard:${{ steps.version.outputs.tag }}
          build-args: |
            DICEPP_IMAGE_TAG=${{ steps.version.outputs.tag }}
            GIT_SHA=${{ steps.version.outputs.sha }}

      - name: Smoke test Dashboard image
        run: |
          docker run -d --name dicepp-dashboard-smoke -p 127.0.0.1:4090:4090 \
            ghcr.io/pear-studio/dicepp-dashboard:${{ steps.version.outputs.tag }}
          ready=false
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4090/api/auth/status >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            docker logs dicepp-dashboard-smoke
            docker rm -f dicepp-dashboard-smoke
            exit 1
          fi
          docker cp scripts/smoke_dashboard_control_channel.py \
            dicepp-dashboard-smoke:/tmp/smoke_dashboard_control_channel.py
          docker exec dicepp-dashboard-smoke \
            python /tmp/smoke_dashboard_control_channel.py
          docker rm -f dicepp-dashboard-smoke

  windows-build:
    name: Windows EXE
    runs-on: windows-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build Bot and Dashboard with PyInstaller
        run: |
          uv run pyinstaller scripts/build/dicepp.spec --clean --noconfirm
          uv run pyinstaller scripts/build/dashboard.spec --clean --noconfirm

      - name: Assemble Windows directory
        shell: pwsh
        run: |
          ./scripts/build/assemble_windows_package.ps1

      - name: Smoke test
        shell: pwsh
        run: |
          function Invoke-PackagedExe {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [string[]]$Arguments = @()
            )
            $stdout = New-TemporaryFile
            $stderr = New-TemporaryFile
            try {
              $process = Start-Process `
                -FilePath (Resolve-Path $Path) `
                -ArgumentList $Arguments `
                -Wait `
                -PassThru `
                -RedirectStandardOutput $stdout `
                -RedirectStandardError $stderr `
                -WindowStyle Hidden
              $out = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
              $err = Get-Content $stderr -Raw -ErrorAction SilentlyContinue
              if ($null -eq $out) {
                $out = ""
              } else {
                $out = $out.Trim()
              }
              if ($null -eq $err) {
                $err = ""
              } else {
                $err = $err.Trim()
              }
              if ($process.ExitCode -ne 0) {
                throw "$Path $($Arguments -join ' ') exited $($process.ExitCode). stdout: '$out' stderr: '$err'"
              }
              return $out
            } finally {
              Remove-Item $stdout, $stderr -ErrorAction SilentlyContinue
            }
          }

          $expected = "DicePP v${{ steps.version.outputs.version }}"
          $actual = Invoke-PackagedExe "dist/DicePP/DicePP-Runtime.exe" @("--version")
          if ($actual -ne $expected) {
            throw "Version mismatch: expected '$expected', got '$actual'"
          }
          Invoke-PackagedExe "dist/DicePP/DicePP-Runtime.exe" @("--smoke-check") | Out-Null

          $dashboardExpected = "DicePP Dashboard v${{ steps.version.outputs.version }}"
          $dashboardActual = Invoke-PackagedExe "dist/DicePP/DicePP.exe" @("--version")
          if ($dashboardActual -ne $dashboardExpected) {
            throw "Dashboard version mismatch: expected '$dashboardExpected', got '$dashboardActual'"
          }
          Invoke-PackagedExe "dist/DicePP/DicePP.exe" @("--smoke-check") | Out-Null

      - name: Package artifact
        shell: pwsh
        run: |
          $zipName = "DicePP-${{ steps.version.outputs.tag }}-win64.zip"
          Compress-Archive -Path dist/DicePP -DestinationPath $zipName

      - uses: actions/upload-artifact@v4
        with:
          name: dicepp-windows
          path: DicePP-*-win64.zip
          retention-days: 7

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-docker, windows-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dicepp-windows

      - name: Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Build image for publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/pear-studio/nonebot-dicepp:${{ steps.version.outputs.tag }}
          build-args: |
            DICEPP_IMAGE_TAG=${{ steps.version.outputs.tag }}
            GIT_SHA=${{ steps.version.outputs.sha }}

      - name: Build Dashboard image for publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          load: true
          tags: |
            ghcr.io/pear-studio/dicepp-dashboard:${{ steps.version.outputs.tag }}
          build-args: |
            DICEPP_IMAGE_TAG=${{ steps.version.outputs.tag }}
            GIT_SHA=${{ steps.version.outputs.sha }}

      - name: Smoke test image for publishing
        run: |
          EXPECTED="DicePP v${{ steps.version.outputs.version }}"
          ACTUAL="$(docker run --rm ghcr.io/pear-studio/nonebot-dicepp:${{ steps.version.outputs.tag }} \
            python bot.py --version)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Version mismatch: expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi

      - name: Smoke test Dashboard image for publishing
        run: |
          docker run -d --name dicepp-dashboard-publish-smoke -p 127.0.0.1:4090:4090 \
            ghcr.io/pear-studio/dicepp-dashboard:${{ steps.version.outputs.tag }}
          ready=false
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4090/api/auth/status >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            docker logs dicepp-dashboard-publish-smoke
            docker rm -f dicepp-dashboard-publish-smoke
            exit 1
          fi
          docker cp scripts/smoke_dashboard_control_channel.py \
            dicepp-dashboard-publish-smoke:/tmp/smoke_dashboard_control_channel.py
          docker exec dicepp-dashboard-publish-smoke \
            python /tmp/smoke_dashboard_control_channel.py
          docker rm -f dicepp-dashboard-publish-smoke

      - name: Package Linux amd64 offline bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip zstd

          TAG="${{ steps.version.outputs.tag }}"
          ARCHIVE="DicePP-${TAG}-linux-amd64-images.tar"
          COMPRESSED="${ARCHIVE}.zst"
          PACKAGE_DIR="DicePP-${TAG}-linux-amd64-offline"
          PACKAGE_ZIP="${PACKAGE_DIR}.zip"

          docker save \
            ghcr.io/pear-studio/nonebot-dicepp:${TAG} \
            ghcr.io/pear-studio/dicepp-dashboard:${TAG} \
            -o "${ARCHIVE}"
          zstd -19 -T0 --rm "${ARCHIVE}" -o "${COMPRESSED}"
          zstd -t "${COMPRESSED}"

          mkdir -p "${PACKAGE_DIR}/images" "${PACKAGE_DIR}/docs"
          mv "${COMPRESSED}" "${PACKAGE_DIR}/images/${COMPRESSED}"
          cp docker-compose.yml "${PACKAGE_DIR}/docker-compose.yml"
          cp docs/linux.md "${PACKAGE_DIR}/docs/linux.md"
          cp docs/configuration.md "${PACKAGE_DIR}/docs/configuration.md"
          cp docs/persona.md "${PACKAGE_DIR}/docs/persona.md"
          cp docs/persona-character-card.md "${PACKAGE_DIR}/docs/persona-character-card.md"

          cat > "${PACKAGE_DIR}/使用说明.md" <<EOF
          # DicePP Linux 离线包使用说明

          请先阅读 docs/linux.md。

          常用文档：

          - docs/linux.md：Linux Docker 部署
          - docs/configuration.md：配置说明
          - docs/persona.md：Persona AI 对话
          - docs/persona-character-card.md：Persona 角色卡

          本包包含 DicePP 的 Linux amd64 Docker 离线镜像和对应版本的 docker-compose.yml。
          EOF

          cat > "${PACKAGE_DIR}/manifest.json" <<EOF
          {
            "name": "DicePP Linux offline package",
            "version": "${TAG}",
            "platform": "linux-amd64",
            "images": [
              "ghcr.io/pear-studio/nonebot-dicepp:${TAG}",
              "ghcr.io/pear-studio/dicepp-dashboard:${TAG}"
            ],
            "image_archive": "images/${COMPRESSED}",
            "compose": "docker-compose.yml",
            "docs": [
              "docs/linux.md",
              "docs/configuration.md",
              "docs/persona.md",
              "docs/persona-character-card.md"
            ]
          }
          EOF

          (
            cd "${PACKAGE_DIR}"
            sha256sum \
              "images/${COMPRESSED}" \
              "docker-compose.yml" \
              "docs/linux.md" \
              "docs/configuration.md" \
              "docs/persona.md" \
              "docs/persona-character-card.md" \
              "使用说明.md" \
              "manifest.json" \
              > checksums.sha256
          )

          zip -r "${PACKAGE_ZIP}" "${PACKAGE_DIR}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push ghcr.io/pear-studio/nonebot-dicepp:${{ steps.version.outputs.tag }}
          docker push ghcr.io/pear-studio/dicepp-dashboard:${{ steps.version.outputs.tag }}
          if [ "${{ steps.version.outputs.is_prerelease }}" = "false" ]; then
            docker tag ghcr.io/pear-studio/nonebot-dicepp:${{ steps.version.outputs.tag }} \
              ghcr.io/pear-studio/nonebot-dicepp:latest
            docker push ghcr.io/pear-studio/nonebot-dicepp:latest
            docker tag ghcr.io/pear-studio/dicepp-dashboard:${{ steps.version.outputs.tag }} \
              ghcr.io/pear-studio/dicepp-dashboard:latest
            docker push ghcr.io/pear-studio/dicepp-dashboard:latest
          else
            echo "Prerelease tag detected; skipping latest tag"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          RELEASE_MD="docs/releases/${TAG}.md"
          RELEASE_FLAGS=()
          if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          ASSETS=(docker-compose.yml)

          shopt -s nullglob
          ZIP_ASSETS=(DicePP-*-win64.zip)
          shopt -u nullglob
          if [ "${#ZIP_ASSETS[@]}" -gt 0 ]; then
            ASSETS+=("${ZIP_ASSETS[@]}")
          else
            echo "::warning::Windows zip asset 不存在，跳过上传"
          fi

          shopt -s nullglob
          OFFLINE_IMAGE_ASSETS=(DicePP-*-linux-amd64-offline.zip)
          shopt -u nullglob
          if [ "${#OFFLINE_IMAGE_ASSETS[@]}" -gt 0 ]; then
            ASSETS+=("${OFFLINE_IMAGE_ASSETS[@]}")
          else
            echo "::warning::Linux 离线镜像包不存在，跳过上传"
          fi

          if [ -f "$RELEASE_MD" ]; then
            gh release create "$TAG" "${RELEASE_FLAGS[@]}" \
              --title "DicePP ${TAG}" \
              --notes-file "$RELEASE_MD" \
              "${ASSETS[@]}"
          else
            echo "::warning::Release metadata 文件 $RELEASE_MD 不存在，使用默认 body"
            gh release create "$TAG" "${RELEASE_FLAGS[@]}" \
              --title "DicePP ${TAG}" \
              --notes "DicePP ${TAG}" \
              "${ASSETS[@]}"
          fi
