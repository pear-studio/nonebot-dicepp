# Build immutable final release candidates before a tag or GitHub Release exists.
# The resulting Actions artifact is the input boundary for upgrade evidence and
# a future same-bytes promotion workflow; this workflow never publishes a Release.
# The sealed artifact and failure diagnostics expire after 30 days. Expiry requires
# rebuilding from the then-current master HEAD. Intermediate artifacts expire after
# 7 days; diagnostics are never a promotion/recovery source.

name: Final Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact PEP 440 project version to build (without v prefix)
        required: true
        type: string
      commit_sha:
        description: Full lowercase 40-character source commit SHA
        required: true
        type: string
      exercise_upgrade_matrix:
        description: Exercise upgrade matrices without adding evidence to release assets
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  candidate-metadata:
    name: Bind Candidate Target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      velopack_version: ${{ steps.metadata.outputs.velopack_version }}
      velopack_channel: ${{ steps.metadata.outputs.velopack_channel }}
      channel: ${{ steps.metadata.outputs.channel }}
      automatic_upgrade: ${{ steps.metadata.outputs.automatic_upgrade }}
    steps:
      - name: Reject an ambiguous target commit
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$INPUT_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Candidate commit must be a full lowercase Git SHA-1"
            exit 1
          fi
          if [ "$WORKFLOW_SHA" != "$INPUT_COMMIT_SHA" ]; then
            echo "Dispatch the candidate workflow from the exact target commit/ref"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Final candidates may only be dispatched from the current master HEAD"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install release metadata dependency
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r scripts/build/release-metadata-requirements.txt
      - name: Derive metadata from the checked-out source
        id: metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [ "$actual_commit" != "$INPUT_COMMIT_SHA" ]; then
            echo "Checked-out commit differs from requested candidate"
            exit 1
          fi
          python scripts/build/release_build_metadata.py derive \
            --ref "refs/tags/v${INPUT_VERSION}" \
            --commit-sha "$actual_commit" \
            --github-output "$GITHUB_OUTPUT"

  quality-gate:
    name: Build and Test Source Candidates
    needs: candidate-metadata
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/test-suite.yml
    with:
      release_tag: ${{ needs.candidate-metadata.outputs.tag }}
      release_version: ${{ needs.candidate-metadata.outputs.version }}
      release_commit_sha: ${{ needs.candidate-metadata.outputs.commit_sha }}

  windows-final:
    name: Build Final Windows Candidate Bytes
    runs-on: windows-latest
    needs: [candidate-metadata, quality-gate]
    permissions:
      contents: read
    outputs:
      python_version: ${{ steps.toolchain.outputs.python_version }}
      uv_version: ${{ steps.toolchain.outputs.uv_version }}
      velopack_version: ${{ steps.install-toolchain.outputs.velopack_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate-metadata.outputs.commit_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.5.24"
      - name: Install build dependencies
        id: install-toolchain
        shell: pwsh
        run: |
          uv sync --frozen --group dev
          ./scripts/build/install_velopack_tool.ps1
      - name: Download tested Windows package tree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dicepp-windows-candidate
          path: dist
      - name: Validate source and tested package identity
        shell: pwsh
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.candidate-metadata.outputs.commit_sha }}
        run: |
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -ne $env:EXPECTED_COMMIT_SHA) {
            throw "Checked-out commit differs from requested candidate"
          }
          uv run --frozen python scripts/build/release_build_metadata.py validate-windows-candidate `
            --path dist/windows-candidate.json `
            --tag "${{ needs.candidate-metadata.outputs.tag }}" `
            --version "${{ needs.candidate-metadata.outputs.version }}" `
            --commit-sha "$env:EXPECTED_COMMIT_SHA" `
            --package-root dist/DicePP
      - name: Build final Velopack artifacts
        shell: pwsh
        run: |
          vpk pack `
            --packId DicePP `
            --packVersion "${{ needs.candidate-metadata.outputs.velopack_version }}" `
            --packDir dist/DicePP `
            --mainExe DicePP.exe `
            --channel "${{ needs.candidate-metadata.outputs.velopack_channel }}"
          $portable = @(Get-ChildItem -Path Releases -Filter "*Portable.zip")
          $setup = @(Get-ChildItem -Path Releases -Filter "*Setup.exe")
          $full = @(Get-ChildItem -Path Releases -Filter "*-full.nupkg")
          if ($portable.Count -ne 1 -or $setup.Count -ne 1 -or $full.Count -ne 1) {
            throw "Velopack output set is incomplete or ambiguous"
          }
          Move-Item $portable[0].FullName "DicePP-${{ needs.candidate-metadata.outputs.tag }}-win64-Portable.zip"
          Move-Item $setup[0].FullName "DicePP-${{ needs.candidate-metadata.outputs.tag }}-win64-Setup.exe"
          $env:PYTHONPATH = "src"
          uv run --frozen python scripts/build/generate_velopack_bundle.py `
            --version "${{ needs.candidate-metadata.outputs.version }}" `
            --velopack-version "${{ needs.candidate-metadata.outputs.velopack_version }}" `
            --channel "${{ needs.candidate-metadata.outputs.channel }}" `
            --nupkg $full[0].FullName `
            --output velopack.win-x64.zip
      - name: Validate final Windows candidate bytes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/diagnostics/windows -Force | Out-Null
          Start-Transcript -Path dist/diagnostics/windows/validation.log -Force
          try {
            ./scripts/build/validate_windows_final_candidate.ps1 `
              -Tag "${{ needs.candidate-metadata.outputs.tag }}" `
              -Version "${{ needs.candidate-metadata.outputs.version }}" `
              -ArtifactRoot . `
              -ValidatedSummaryPath dist/validated-windows.json `
              -ProcessDiagnosticsRoot dist/diagnostics/windows/process-runner
          } finally {
            Stop-Transcript
          }
      - name: Collect Windows candidate diagnostics
        if: always()
        shell: pwsh
        run: |
          $diagnostics = "dist/diagnostics/windows"
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          Get-CimInstance Win32_Process |
            Select-Object ProcessId, ParentProcessId, Name, CommandLine |
            Format-Table -AutoSize -Wrap |
            Out-File "$diagnostics/process-tree.txt" -Width 4096
          Get-NetTCPConnection -ErrorAction SilentlyContinue |
            Sort-Object LocalPort |
            Format-Table -AutoSize |
            Out-File "$diagnostics/tcp-connections.txt" -Width 4096
          Get-ChildItem -LiteralPath . -File |
            Select-Object Name, Length, LastWriteTimeUtc |
            Format-Table -AutoSize |
            Out-File "$diagnostics/final-assets.txt" -Width 4096
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Force -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTimeUtc |
            Format-Table -AutoSize |
            Out-File "$diagnostics/runner-temp.txt" -Width 4096
      - name: Record Windows toolchain
        id: toolchain
        shell: pwsh
        run: |
          "python_version=$(python --version)" >> $env:GITHUB_OUTPUT
          "uv_version=$(uv --version)" >> $env:GITHUB_OUTPUT
      - name: Stage final Windows candidate bytes
        shell: pwsh
        run: |
          $stage = "dist/final-windows"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath `
            "DicePP-${{ needs.candidate-metadata.outputs.tag }}-win64-Portable.zip", `
            "DicePP-${{ needs.candidate-metadata.outputs.tag }}-win64-Setup.exe", `
            "velopack.win-x64.zip" `
            -Destination $stage
          Copy-Item -LiteralPath dist/validated-windows.json `
            -Destination "$stage/validated-summary.json"
      - name: Upload final Windows candidate bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dicepp-final-windows-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/final-windows
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows candidate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dicepp-final-windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/diagnostics/windows
          if-no-files-found: warn
          retention-days: 30

  linux-final:
    name: Build Final Linux Candidate Bytes
    runs-on: ubuntu-latest
    needs: [candidate-metadata, quality-gate]
    permissions:
      contents: read
      packages: read
    outputs:
      docker_version: ${{ steps.toolchain.outputs.docker_version }}
      zstd_version: ${{ steps.toolchain.outputs.zstd_version }}
      runner_version: ${{ steps.toolchain.outputs.runner_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate-metadata.outputs.commit_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.5.24"
      - name: Install packaging dependencies
        run: |
          uv sync --frozen
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip zstd
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull exact tested container candidates
        env:
          RUNTIME_REF: ${{ needs.quality-gate.outputs.runtime_candidate_ref }}
          RUNTIME_DIGEST: ${{ needs.quality-gate.outputs.runtime_candidate_digest }}
          RUNTIME_IMAGE_ID: ${{ needs.quality-gate.outputs.runtime_candidate_image_id }}
          DASHBOARD_REF: ${{ needs.quality-gate.outputs.dashboard_candidate_ref }}
          DASHBOARD_DIGEST: ${{ needs.quality-gate.outputs.dashboard_candidate_digest }}
          DASHBOARD_IMAGE_ID: ${{ needs.quality-gate.outputs.dashboard_candidate_image_id }}
          TAG: ${{ needs.candidate-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.candidate-metadata.outputs.commit_sha }}"
          for value in "$RUNTIME_REF" "$RUNTIME_DIGEST" "$RUNTIME_IMAGE_ID" "$DASHBOARD_REF" "$DASHBOARD_DIGEST" "$DASHBOARD_IMAGE_ID"; do
            test -n "$value"
          done
          docker pull "${RUNTIME_REF%@*}@${RUNTIME_DIGEST}"
          docker pull "${DASHBOARD_REF%@*}@${DASHBOARD_DIGEST}"
          test "$(docker image inspect --format '{{.Id}}' "${RUNTIME_REF%@*}@${RUNTIME_DIGEST}")" = "$RUNTIME_IMAGE_ID"
          test "$(docker image inspect --format '{{.Id}}' "${DASHBOARD_REF%@*}@${DASHBOARD_DIGEST}")" = "$DASHBOARD_IMAGE_ID"
          docker tag "${RUNTIME_REF%@*}@${RUNTIME_DIGEST}" "ghcr.io/pear-studio/nonebot-dicepp:${TAG}"
          docker tag "${DASHBOARD_REF%@*}@${DASHBOARD_DIGEST}" "ghcr.io/pear-studio/dicepp-dashboard:${TAG}"
      - name: Package final Linux bundle
        env:
          TAG: ${{ needs.candidate-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          BOT_IMAGE="ghcr.io/pear-studio/nonebot-dicepp:${TAG}"
          DASHBOARD_IMAGE="ghcr.io/pear-studio/dicepp-dashboard:${TAG}"
          BOT_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$BOT_IMAGE")"
          DASHBOARD_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$DASHBOARD_IMAGE")"
          ARCHIVE="DicePP-${TAG}-linux-amd64-images.tar"
          COMPRESSED="${ARCHIVE}.zst"
          PACKAGE_DIR="DicePP-${TAG}-linux-amd64"
          PACKAGE_ZIP="${PACKAGE_DIR}.zip"
          docker save "$BOT_IMAGE" "$DASHBOARD_IMAGE" -o "$ARCHIVE"
          zstd -19 -T0 --rm "$ARCHIVE" -o "$COMPRESSED"
          zstd -t "$COMPRESSED"
          mkdir -p "${PACKAGE_DIR}/images" "${PACKAGE_DIR}/docs"
          mv "$COMPRESSED" "${PACKAGE_DIR}/images/${COMPRESSED}"
          cp docker-compose.yml "${PACKAGE_DIR}/docker-compose.yml"
          cp docs/linux.md docs/configuration.md docs/persona.md docs/persona-character-card.md "${PACKAGE_DIR}/docs/"
          cat > "${PACKAGE_DIR}/使用说明.md" <<EOF
          # DicePP Linux 发布包使用说明

          请先阅读 docs/linux.md。本包包含 DicePP Linux amd64 Docker 镜像与对应版本部署文件。
          EOF
          PYTHONPATH=src uv run --frozen python scripts/build/generate_linux_package_manifest.py \
            --version "$TAG" \
            --package-root "$PACKAGE_DIR" \
            --compose "${PACKAGE_DIR}/docker-compose.yml" \
            --image-archive "${PACKAGE_DIR}/images/${COMPRESSED}" \
            --image "$BOT_IMAGE" --image "$DASHBOARD_IMAGE" \
            --image-id "$BOT_IMAGE_ID" --image-id "$DASHBOARD_IMAGE_ID" \
            --release-notes "docs/releases/${TAG}.md" \
            --output "${PACKAGE_DIR}/dicepp-package.json"
          (
            cd "$PACKAGE_DIR"
            sha256sum images/* docker-compose.yml docs/* 使用说明.md dicepp-package.json > checksums.sha256
            zip -r "../${PACKAGE_ZIP}" .
          )
      - name: Validate final Linux bundle bytes
        env:
          TAG: ${{ needs.candidate-metadata.outputs.tag }}
          RUNTIME_IMAGE_ID: ${{ needs.quality-gate.outputs.runtime_candidate_image_id }}
          DASHBOARD_IMAGE_ID: ${{ needs.quality-gate.outputs.dashboard_candidate_image_id }}
          CANDIDATE_DIAGNOSTICS_ROOT: dist/diagnostics/linux
        run: |
          bash scripts/build/validate_linux_final_candidate.sh \
            "$TAG" \
            "DicePP-${TAG}-linux-amd64.zip" \
            "$RUNTIME_IMAGE_ID" \
            "$DASHBOARD_IMAGE_ID" \
            "dist/validated-linux.json"
      - name: Collect Linux candidate diagnostics
        if: always()
        env:
          TAG: ${{ needs.candidate-metadata.outputs.tag }}
        run: |
          set -uo pipefail
          mkdir -p dist/diagnostics/linux
          docker info > dist/diagnostics/linux/docker-info.txt 2>&1 || :
          docker ps -a --no-trunc > dist/diagnostics/linux/containers.txt 2>&1 || :
          docker image ls --digests --no-trunc > dist/diagnostics/linux/images.txt 2>&1 || :
          df -h > dist/diagnostics/linux/disk.txt 2>&1 || :
          find . -maxdepth 3 -type f -printf '%p %s bytes\n' \
            > dist/diagnostics/linux/final-assets.txt 2>&1 || :
      - name: Record Linux toolchain
        id: toolchain
        run: |
          echo "docker_version=$(docker --version)" >> "$GITHUB_OUTPUT"
          echo "zstd_version=$(zstd --version | head -n1)" >> "$GITHUB_OUTPUT"
          echo "runner_version=${ImageOS}/${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Stage final Linux candidate bytes
        env:
          TAG: ${{ needs.candidate-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/final-linux
          cp "DicePP-${TAG}-linux-amd64.zip" dist/final-linux/
          cp dist/validated-linux.json dist/final-linux/validated-summary.json
      - name: Upload final Linux candidate bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dicepp-final-linux-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/final-linux
          if-no-files-found: error
          retention-days: 7
      - name: Upload Linux candidate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dicepp-final-linux-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/diagnostics/linux
          if-no-files-found: warn
          retention-days: 30

  windows-upgrade-matrix:
    name: Exercise Final Windows Bytes From Supported Sources
    if: >-
      needs.candidate-metadata.outputs.automatic_upgrade == 'true' ||
      inputs.exercise_upgrade_matrix == true
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [candidate-metadata, windows-final]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate-metadata.outputs.commit_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dicepp-final-windows-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/target
      - name: Run the Windows cross-version matrix against final bytes
        shell: pwsh
        run: |
          python scripts/build/upgrade_evidence.py check-readiness `
            --registry scripts/build/upgrade_protocol_registry.json
          python scripts/build/upgrade_matrix_runner.py run-platform `
            --matrix scripts/build/upgrade_matrix.json `
            --platform windows `
            --arch amd64 `
            --target-version "${{ needs.candidate-metadata.outputs.version }}" `
            --target-commit-sha "${{ needs.candidate-metadata.outputs.commit_sha }}" `
            --target-asset "portable=dist/target/DicePP-${{ needs.candidate-metadata.outputs.tag }}-win64-Portable.zip" `
            --target-asset "setup=dist/target/DicePP-${{ needs.candidate-metadata.outputs.tag }}-win64-Setup.exe" `
            --target-asset "velopack-bundle=dist/target/velopack.win-x64.zip" `
            --source-cache dist/upgrade-cache `
            --work-root dist/upgrade-work `
            --output dist/upgrade-result/windows.json
      - name: Upload Windows matrix result and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dicepp-upgrade-result-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/upgrade-result
            dist/upgrade-work
          if-no-files-found: error
          retention-days: 30

  linux-upgrade-matrix:
    name: Exercise Final Linux Bytes From Supported Sources
    if: >-
      needs.candidate-metadata.outputs.automatic_upgrade == 'true' ||
      inputs.exercise_upgrade_matrix == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [candidate-metadata, linux-final]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate-metadata.outputs.commit_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install zstd for image archive decompression
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
      - name: Diagnose Docker and zstd toolchain
        run: |
          zstd --version
          docker compose version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dicepp-final-linux-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/target
      - name: Run the Linux cross-version matrix against final bytes
        run: |
          set -euo pipefail
          python scripts/build/upgrade_evidence.py check-readiness \
            --registry scripts/build/upgrade_protocol_registry.json
          python scripts/build/upgrade_matrix_runner.py run-platform \
            --matrix scripts/build/upgrade_matrix.json \
            --platform linux \
            --arch amd64 \
            --target-version "${{ needs.candidate-metadata.outputs.version }}" \
            --target-commit-sha "${{ needs.candidate-metadata.outputs.commit_sha }}" \
            --target-asset "linux-bundle=dist/target/DicePP-${{ needs.candidate-metadata.outputs.tag }}-linux-amd64.zip" \
            --source-cache dist/upgrade-cache \
            --work-root dist/upgrade-work \
            --output dist/upgrade-result/linux.json
      - name: Upload Linux matrix result and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dicepp-upgrade-result-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/upgrade-result
            dist/upgrade-work
            !dist/upgrade-work/**/manager/state/api-token
            !dist/upgrade-work/**/manager/control/**
            !dist/upgrade-work/**/manager/docker-proxy.sock
            !dist/upgrade-work/**/*-images/**
            !dist/upgrade-work/**/manager/packages/**
          if-no-files-found: error
          retention-days: 30

  upgrade-evidence:
    name: Bind Upgrade Evidence To Final Candidate Bytes
    if: >-
      always() &&
      needs.candidate-metadata.result == 'success' &&
      ((needs.candidate-metadata.outputs.automatic_upgrade != 'true' &&
        inputs.exercise_upgrade_matrix != true) ||
       (needs.windows-upgrade-matrix.result == 'success' &&
        needs.linux-upgrade-matrix.result == 'success'))
    runs-on: ubuntu-latest
    needs:
      - candidate-metadata
      - quality-gate
      - windows-upgrade-matrix
      - linux-upgrade-matrix
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: >-
          needs.candidate-metadata.outputs.automatic_upgrade == 'true' ||
          inputs.exercise_upgrade_matrix == true
        with:
          ref: ${{ needs.candidate-metadata.outputs.commit_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: >-
          needs.candidate-metadata.outputs.automatic_upgrade == 'true' ||
          inputs.exercise_upgrade_matrix == true
        with:
          pattern: dicepp-upgrade-result-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/platform-results
      - name: Assemble closed cross-version evidence
        if: >-
          needs.candidate-metadata.outputs.automatic_upgrade == 'true' ||
          inputs.exercise_upgrade_matrix == true
        run: |
          set -euo pipefail
          python scripts/build/upgrade_matrix_runner.py assemble \
            --matrix scripts/build/upgrade_matrix.json \
            --target-version "${{ needs.candidate-metadata.outputs.version }}" \
            --target-commit-sha "${{ needs.candidate-metadata.outputs.commit_sha }}" \
            --candidate "linux:runtime-manifest:${{ needs.quality-gate.outputs.runtime_candidate_digest }}" \
            --candidate "linux:dashboard-manifest:${{ needs.quality-gate.outputs.dashboard_candidate_digest }}" \
            --candidate "windows:package-tree:${{ needs.quality-gate.outputs.windows_candidate_digest }}" \
            --platform-result dist/platform-results/dicepp-upgrade-result-windows-${{ github.run_id }}-${{ github.run_attempt }}/upgrade-result/windows.json \
            --platform-result dist/platform-results/dicepp-upgrade-result-linux-${{ github.run_id }}-${{ github.run_attempt }}/upgrade-result/linux.json \
            --output dist/upgrade-evidence/evidence.json
      - name: Upload commit-and-final-byte-bound upgrade evidence
        if: >-
          needs.candidate-metadata.outputs.automatic_upgrade == 'true' ||
          inputs.exercise_upgrade_matrix == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dicepp-upgrade-evidence
          path: dist/upgrade-evidence/evidence.json
          if-no-files-found: error
          retention-days: 30

  receipt:
    name: Seal Final Candidate Receipt
    runs-on: ubuntu-latest
    needs:
      - candidate-metadata
      - quality-gate
      - windows-final
      - linux-final
      - upgrade-evidence
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate-metadata.outputs.commit_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.5.24"
      - name: Install project dependencies
        run: uv sync --frozen
      - name: Install release metadata dependency
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r scripts/build/release-metadata-requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dicepp-final-windows-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/staged/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dicepp-final-linux-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/staged/linux
      - name: Download commit-bound upgrade evidence
        if: needs.candidate-metadata.outputs.automatic_upgrade == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # The platform matrix consumes final package bytes; this aggregator
          # is the sole producer and Receipt rechecks every final asset digest.
          name: dicepp-upgrade-evidence
          path: dist/staged/upgrade-evidence
      - name: Stage every final GitHub Release asset
        env:
          TAG: ${{ needs.candidate-metadata.outputs.tag }}
          VERSION: ${{ needs.candidate-metadata.outputs.version }}
          COMMIT_SHA: ${{ needs.candidate-metadata.outputs.commit_sha }}
          CHANNEL: ${{ needs.candidate-metadata.outputs.channel }}
          AUTOMATIC_UPGRADE: ${{ needs.candidate-metadata.outputs.automatic_upgrade }}
          RUNTIME_DIGEST: ${{ needs.quality-gate.outputs.runtime_candidate_digest }}
          DASHBOARD_DIGEST: ${{ needs.quality-gate.outputs.dashboard_candidate_digest }}
          PACKAGE_TREE_SHA256: ${{ needs.quality-gate.outputs.windows_candidate_digest }}
        run: |
          set -euo pipefail
          mkdir -p dist/final
          cp "dist/staged/windows/DicePP-${TAG}-win64-Portable.zip" dist/final/
          cp "dist/staged/windows/DicePP-${TAG}-win64-Setup.exe" dist/final/
          cp dist/staged/windows/velopack.win-x64.zip dist/final/
          cp "dist/staged/linux/DicePP-${TAG}-linux-amd64.zip" dist/final/
          cp docker-compose.yml dist/final/docker-compose.yml

          EVIDENCE_ARGS=()
          if [ "$AUTOMATIC_UPGRADE" = "true" ]; then
            test -f dist/staged/upgrade-evidence/evidence.json
            cp dist/staged/upgrade-evidence/evidence.json \
              dist/final/dicepp-upgrade-evidence.json
            EVIDENCE_ARGS+=(
              --commit-sha "$COMMIT_SHA"
              --candidate "linux:runtime-manifest:${RUNTIME_DIGEST}"
              --candidate "linux:dashboard-manifest:${DASHBOARD_DIGEST}"
              --candidate "windows:package-tree:${PACKAGE_TREE_SHA256}"
              --upgrade-matrix scripts/build/upgrade_matrix.json
              --upgrade-evidence dist/final/dicepp-upgrade-evidence.json
            )
          fi
          PYTHONPATH=src uv run --frozen python scripts/build/generate_release_manifest.py \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --release-notes "docs/releases/${TAG}.md" \
            "${EVIDENCE_ARGS[@]}" \
            --artifact "windows:amd64:portable:dist/final/DicePP-${TAG}-win64-Portable.zip" \
            --artifact "windows:amd64:setup:dist/final/DicePP-${TAG}-win64-Setup.exe" \
            --artifact "windows:amd64:velopack-bundle:dist/final/velopack.win-x64.zip" \
            --artifact "linux:amd64:linux-bundle:dist/final/DicePP-${TAG}-linux-amd64.zip" \
            --output dist/final/dicepp-release.json
      - name: Generate immutable candidate receipt
        env:
          VERSION: ${{ needs.candidate-metadata.outputs.version }}
          COMMIT_SHA: ${{ needs.candidate-metadata.outputs.commit_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          ARTIFACT_NAME: dicepp-final-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          PACKAGE_TREE_SHA256: ${{ needs.quality-gate.outputs.windows_candidate_digest }}
          RUNTIME_REF: ${{ needs.quality-gate.outputs.runtime_candidate_ref }}
          RUNTIME_DIGEST: ${{ needs.quality-gate.outputs.runtime_candidate_digest }}
          RUNTIME_IMAGE_ID: ${{ needs.quality-gate.outputs.runtime_candidate_image_id }}
          DASHBOARD_REF: ${{ needs.quality-gate.outputs.dashboard_candidate_ref }}
          DASHBOARD_DIGEST: ${{ needs.quality-gate.outputs.dashboard_candidate_digest }}
          DASHBOARD_IMAGE_ID: ${{ needs.quality-gate.outputs.dashboard_candidate_image_id }}
          PYTHON_VERSION: ${{ needs.windows-final.outputs.python_version }}
          UV_VERSION: ${{ needs.windows-final.outputs.uv_version }}
          VELOPACK_VERSION: ${{ needs.windows-final.outputs.velopack_version }}
          DOCKER_VERSION: ${{ needs.linux-final.outputs.docker_version }}
          ZSTD_VERSION: ${{ needs.linux-final.outputs.zstd_version }}
          RUNNER_VERSION: ${{ needs.linux-final.outputs.runner_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          python scripts/build/candidate_receipt.py \
            --artifact-root dist/final \
            --output dist/final/dicepp-candidate.json \
            --validated-summary dist/staged/windows/validated-summary.json \
            --validated-summary dist/staged/linux/validated-summary.json \
            --version "$VERSION" \
            --commit-sha "$COMMIT_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-sha "$WORKFLOW_SHA" \
            --artifact-name "$ARTIFACT_NAME" \
            --package-tree-sha256 "$PACKAGE_TREE_SHA256" \
            --container "runtime|$RUNTIME_REF|$RUNTIME_DIGEST|$RUNTIME_IMAGE_ID" \
            --container "dashboard|$DASHBOARD_REF|$DASHBOARD_DIGEST|$DASHBOARD_IMAGE_ID" \
            --toolchain "python=$PYTHON_VERSION" \
            --toolchain "uv=$UV_VERSION" \
            --toolchain "velopack=$VELOPACK_VERSION" \
            --toolchain "docker=$DOCKER_VERSION" \
            --toolchain "zstd=$ZSTD_VERSION" \
            --toolchain "ubuntu-runner=$RUNNER_VERSION"
      - name: Collect candidate seal diagnostics
        if: always()
        run: |
          set -u
          mkdir -p dist/diagnostics/seal
          git rev-parse HEAD > dist/diagnostics/seal/checked-out-head.txt 2>&1 || :
          find dist -maxdepth 4 -type f -printf '%p %s bytes\n' \
            > dist/diagnostics/seal/staged-files.txt 2>&1 || :
          find dist/final -maxdepth 1 -type f -exec sha256sum -- {} + \
            > dist/diagnostics/seal/final-sha256.txt 2>&1 || :
          for summary in \
            dist/staged/windows/validated-summary.json \
            dist/staged/linux/validated-summary.json; do
            if [ -f "$summary" ]; then
              cp "$summary" "dist/diagnostics/seal/$(basename "$(dirname "$summary")")-validated-summary.json"
            fi
          done
      - name: Upload sealed final candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dicepp-final-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/final
          if-no-files-found: error
          retention-days: 30
      - name: Upload candidate seal diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dicepp-final-seal-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/diagnostics/seal
          if-no-files-found: warn
          retention-days: 30
      - name: Publish sealed candidate identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          test -n "$ARTIFACT_URL"
          {
            echo "### Sealed final candidate"
            echo
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "- Artifact URL: $ARTIFACT_URL"
            echo "- Sealed artifact retention: 30 days"
            echo "- Failure diagnostics retention: 30 days (diagnostic only; never promotable)"
            echo "- Intermediate Windows/Linux payload artifacts: 7 days (not a recovery source)"
            echo "- After expiry: dispatch the complete Final Candidate workflow again from the then-current master HEAD; do not reconstruct or mix bytes from intermediate artifacts"
          } >> "$GITHUB_STEP_SUMMARY"
