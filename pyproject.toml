[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# ── 依赖声明（供 uv sync / pip install 使用）──────────────────────────────────
[project]
name = "dicepp"
version = "3.0.0rc17"
description = "DicePP NoneBot2 Plugin"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=23.0",
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "nonebot2>=2.4.0",
    "openai>=1.0.0",
    "nb-cli>=1.4.0",
    "nonebot-adapter-onebot>=2.4.0",
    "openpyxl>=3.0.9",
    "rsa>=4.8",
    "gitpython>=3.1.40",
    "python-docx>=0.8.11",
    "lxml>=4.9.2",
    "uvicorn[standard]>=0.24.0",
    "fastapi>=0.100.0",
    "filelock>=3.29.0",
    "zhconv>=1.4.3",
    "psutil>=5.9.0",
    "requests>=2.28.0,<2.32.0",
    "urllib3>=1.21.1,<2.0.0,!=1.25.0,!=1.25.1",
    "charset-normalizer>=3.0.0,<3.4.0",
    "chardet>=3.0.2,<6.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.19.0",
    "lark>=1.1.0",
    "websockets>=15.0.1",
    "loguru>=0.7.0",
    "pystray>=0.19",
    "pillow>=10.0",
    "packaging>=24.0",
]

[project.scripts]
dicepp-shell = "plugins.DicePP.shell.main:main"

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.5",
    "pyinstaller>=6.0",
    "bump-my-version>=0.28",
    "playwright>=1.40,<2.0",
]

[tool.uv]
dependency-metadata = []

# ── nonebot 配置 ────────────────────────────────────────────────────────────
[nonebot.plugins]
plugins = []
plugin_dirs = []

[tool.nonebot]
plugin_dirs = []
builtin_plugins = []

[tool.nonebot.plugins]
"@local" = []

[tool.nonebot.adapters]
"@local" = []

# ── pytest 配置 ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration", "tests/system"]
pythonpath = [".", "src"]
python_files = ["unit_test.py", "test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test*"]
addopts = "--tb=short --timeout=30 --strict-markers --strict-config --import-mode=importlib -n auto --dist loadfile"
markers = [
    "quick: Stable representative tests for high-frequency local and CI feedback",
]
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

# ── coverage 配置（替代 .coveragerc）─────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["src/plugins/DicePP"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 60

# ── 版本号自动递增 ────────────────────────────────────────────────────────────
# 使用: uv run bump-my-version bump patch/minor/major
# 仅开发环境安装 (dependency-groups.dev)，不会进入生产部署
[tool.bumpversion]
current_version = "3.0.0"
commit = true
tag = true
message = "Bump version: {current_version} → {new_version}"
tag_name = "v{new_version}"
parse = """(?P<major>0|[1-9]\\d*)\\.(?P<minor>0|[1-9]\\d*)\\.(?P<patch>0|[1-9]\\d*)
"""
serialize = ["{major}.{minor}.{patch}"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
