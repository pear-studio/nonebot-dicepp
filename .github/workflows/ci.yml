# DicePP CI - Test and Compatibility Checks
#
# This workflow runs on every push and pull request to ensure:
# 1. All unit tests pass
# 2. Compatibility corpus achieves 100% pass rate (required for AST engine migration)

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install ".[dev]"
      
      - name: Run unit tests
        run: |
          uv run pytest -m unit --tb=short -q

      - name: Run integration tests
        run: |
          uv run pytest -m integration --tb=short -q
      
      - name: Run compatibility corpus tests
        run: |
          uv run pytest tests/module/roll/test_compatibility_corpus.py -v --tb=long -x
