name: Test Suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quick:
    name: Quick Feedback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.11.16"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Check test architecture
        run: uv run python -m tools.check_test_layout tests
      - name: Run quick representative suite
        run: uv run pytest -m quick -n0 --tb=short -q

  runtime-normal-path:
    name: Current Runtime Normal Path
    runs-on: ubuntu-latest
    needs: quick
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.11.16"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Run current runtime normal-path contracts
        run: >-
          uv run pytest -n0 -q
          tests/system/process/dashboard/test_bot_process.py
          tests/integration/dashboard/test_launcher_runtime_log.py
          tests/integration/dashboard/test_archives_local.py
          tests/integration/dashboard/test_instance_data.py

  docker-smoke:
    name: Single Image Smoke
    runs-on: ubuntu-latest
    needs: quick
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build DicePP image
        run: docker build -f Dockerfile -t dicepp:ci .
      - name: Smoke test Dashboard and Bot entrypoints
        run: |
          expected="$(sed -n 's/^version = \"\(.*\)\"$/\1/p' pyproject.toml)"
          test "$(docker run --rm --network=none dicepp:ci python -m dashboard --version)" = "DicePP Dashboard v$expected"
          test "$(docker run --rm --network=none dicepp:ci python bot.py --version)" = "DicePP v$expected"
          docker run -d --name dicepp-ci-smoke \
            -e DICEPP_ONEBOT_HOST=0.0.0.0 \
            -p 127.0.0.1:4090:4090 -p 127.0.0.1:8080:8080 \
            dicepp:ci
          trap 'docker rm -f dicepp-ci-smoke >/dev/null 2>&1 || true' EXIT
          dashboard_ready=false
          onebot_ready=false
          for i in $(seq 1 45); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4090/api/health >/dev/null; then dashboard_ready=true; fi
            onebot_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 http://127.0.0.1:8080/ || true)"
            if [ "$onebot_code" != "000" ]; then onebot_ready=true; fi
            if [ "$dashboard_ready" = true ] && [ "$onebot_ready" = true ]; then break; fi
            sleep 1
          done
          if [ "$dashboard_ready" != true ] || [ "$onebot_ready" != true ]; then docker logs dicepp-ci-smoke; exit 1; fi
          docker rm -f dicepp-ci-smoke >/dev/null

  windows-package:
    name: Windows Portable Package
    runs-on: windows-latest
    needs: quick
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.11.16"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Build and assemble Portable
        shell: pwsh
        run: |
          uv run pyinstaller scripts/build/dicepp.spec --clean --noconfirm
          uv run pyinstaller scripts/build/dashboard.spec --clean --noconfirm
          ./scripts/build/assemble_windows_package.ps1
      - name: Verify normal Portable startup
        shell: pwsh
        run: |
          ./scripts/build/verify_windows_package.ps1 -DistDir dist/DicePP
          Compress-Archive -Path dist/DicePP -DestinationPath DicePP-ci-win64-Portable.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dicepp-windows-ci
          path: DicePP-ci-win64-Portable.zip
          retention-days: 3
