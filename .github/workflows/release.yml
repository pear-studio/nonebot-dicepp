# DicePP Release — tag push 触发镜像构建、GHCR 推送、Windows EXE 构建和 GitHub Release 创建
#
# 触发: push v*.*.* tag  或  workflow_dispatch（手动触发用于测试）
# 产物: ghcr.io/pear-studio/nonebot-dicepp:vX.Y.Z + :latest
#       DicePP-vX.Y.Z-win64.zip
#       GitHub Release（body 来自 docs/releases/vX.Y.Z.md）
#       docker-compose.yml 和 Windows zip 作为 release assets

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (不含 v 前缀，如 3.0.1)'
        required: true
        type: string

permissions:
  contents: write     # 创建 GitHub Release + 上传 assets
  packages: write     # 推送 GHCR 镜像

jobs:
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build image (local only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/pear-studio/nonebot-dicepp:${{ steps.version.outputs.tag }}
          build-args: |
            DICEPP_IMAGE_TAG=${{ steps.version.outputs.tag }}
            GIT_SHA=${{ steps.version.outputs.sha }}

      - name: Smoke test image
        run: |
          docker run --rm ghcr.io/pear-studio/nonebot-dicepp:${{ steps.version.outputs.tag }} \
            python bot.py --version

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag ghcr.io/pear-studio/nonebot-dicepp:${{ steps.version.outputs.tag }} \
            ghcr.io/pear-studio/nonebot-dicepp:latest
          docker push ghcr.io/pear-studio/nonebot-dicepp:${{ steps.version.outputs.tag }}
          docker push ghcr.io/pear-studio/nonebot-dicepp:latest

  windows-build:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build with PyInstaller
        run: uv run pyinstaller scripts/build/dicepp.spec --clean --noconfirm

      - name: Smoke test
        shell: bash
        run: |
          ./dist/DicePP/DicePP.exe --version
          ./dist/DicePP/DicePP.exe --smoke-check

      - name: Package artifact
        shell: pwsh
        run: |
          $zipName = "DicePP-${{ steps.version.outputs.tag }}-win64.zip"
          Compress-Archive -Path dist/DicePP -DestinationPath $zipName

      - uses: actions/upload-artifact@v4
        with:
          name: dicepp-windows
          path: DicePP-*-win64.zip
          retention-days: 7

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-docker, windows-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dicepp-windows

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          RELEASE_MD="docs/releases/${TAG}.md"
          ZIP=$(ls DicePP-*-win64.zip 2>/dev/null || echo "")
          if [ -f "$RELEASE_MD" ]; then
            gh release create "$TAG" \
              --title "DicePP ${TAG}" \
              --notes-file "$RELEASE_MD" \
              docker-compose.yml $ZIP
          else
            echo "::warning::Release metadata 文件 $RELEASE_MD 不存在，使用默认 body"
            gh release create "$TAG" \
              --title "DicePP ${TAG}" \
              --notes "DicePP ${TAG}" \
              docker-compose.yml $ZIP
          fi
