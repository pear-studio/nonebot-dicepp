services:
  dicepp:
    image: "ghcr.io/pear-studio/nonebot-dicepp:${DICEPP_IMAGE_TAG:-latest}"
    container_name: dicepp
    restart: unless-stopped

    networks:
      - dice-net

    ports:
      - "4090:4090"
    # NapCat/LLOneBot connects to ws://dicepp:8080/onebot/v11/ws.
    expose:
      - "8080"

    environment:
      TZ: Asia/Shanghai
      DICEPP_PROJECT_ROOT: /app
      DICEPP_ONEBOT_HOST: 0.0.0.0

    volumes:
      - ./config:/app/config:rw
      - ./data:/app/data:rw
      - ./content:/app/content:rw
      - ./dashboard/data:/app/dashboard/data:rw

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4090/api/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
        compress: "true"

networks:
  dice-net:
    external: true
