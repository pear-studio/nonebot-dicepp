# DicePP Test Suite — shared reusable workflow for CI and Release gates
#
# 测试分层 (pytest marker 体系):
#   1. fast     — 主体单元/模块测试 (排除 slow/integration/e2e/real_llm)
#   2. slow     — 统计采样、蒙特卡洛等耗时测试
#   3. integration — 跨模块集成测试
#   4. e2e      — 完整 bot 生命周期测试
#   5. compatibility — AST 引擎兼容性语料 (必须 100% 通过)
#   6. playwright — Dashboard 浏览器流程（CI 强制安装 Chromium，不允许跳过）
#   7. dashboard-image — Dashboard 容器构建与 HTTP 冒烟
#   8. windows-package — Windows 双 EXE 构建、冒烟与 ZIP 组装
#   9. coverage — 非 real_llm 测试覆盖率门槛

name: Test Suite

on:
  workflow_call:

jobs:
  fast:
    name: Fast Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint — forbid datetime.now() in tests
        run: |
          if grep -rn 'datetime\.now()' tests/ --include="*.py" | grep -v '# allow: datetime.now'; then
            echo "ERROR: datetime.now() found in tests. Use wall_now() or a fixed datetime instead."
            echo "If this usage is legitimate, add a '# allow: datetime.now' comment on the same line."
            exit 1
          fi
          echo "OK: no datetime.now() in tests"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
      - name: Run fast tests
        run: |
          uv run pytest -m "not (slow or integration or e2e or real_llm)" --tb=short -q

  slow:
    name: Slow Tests
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
      - name: Run slow tests
        run: |
          uv run pytest -m "slow and not integration and not e2e and not real_llm" --tb=short -q

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
      - name: Run integration tests
        run: |
          uv run pytest -m "integration and not e2e and not real_llm" --tb=short -q

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
      - name: Run e2e tests
        run: |
          uv run pytest -m "e2e and not real_llm" --tb=short -q

  compatibility:
    name: Compatibility Corpus
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
      - name: Run compatibility corpus
        run: |
          uv run pytest -m compatibility -v --tb=long -x

  playwright:
    name: Dashboard Playwright
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
      - name: Install Playwright Chromium
        run: |
          uv run playwright install --with-deps chromium
      - name: Run Dashboard browser tests
        env:
          DICEPP_REQUIRE_PLAYWRIGHT: "1"
        run: |
          uv run pytest tests/dashboard/test_smoke_playwright.py --tb=short -q

  dashboard-image:
    name: Dashboard Image
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
      - name: Build Dashboard image
        run: |
          docker build -f Dockerfile.dashboard -t dicepp-dashboard:ci .
      - name: Smoke test Dashboard image
        run: |
          docker run -d --name dicepp-dashboard-smoke -p 127.0.0.1:4090:4090 dicepp-dashboard:ci
          ready=false
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4090/api/auth/status >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            docker logs dicepp-dashboard-smoke
            exit 1
          fi
          docker cp scripts/smoke_dashboard_control_channel.py \
            dicepp-dashboard-smoke:/tmp/smoke_dashboard_control_channel.py
          docker exec dicepp-dashboard-smoke \
            python /tmp/smoke_dashboard_control_channel.py
      - name: Clean up Dashboard container
        if: always()
        run: |
          docker rm -f dicepp-dashboard-smoke 2>/dev/null || true

  windows-package:
    name: Windows Package
    runs-on: windows-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
      - name: Install Playwright Chromium
        run: |
          uv run playwright install chromium
      - name: Build Bot and Dashboard
        run: |
          uv run pyinstaller scripts/build/dicepp.spec --clean --noconfirm
          uv run pyinstaller scripts/build/dashboard.spec --clean --noconfirm
      - name: Assemble and smoke test package
        shell: pwsh
        run: |
          Copy-Item dist/DicePPDashboard.exe dist/DicePP/DicePPDashboard.exe
          New-Item -ItemType Directory -Force dist/DicePP/config/bots | Out-Null
          Copy-Item config/global.json dist/DicePP/config/global.json
          Copy-Item config/schema.json dist/DicePP/config/schema.json
          Copy-Item config/bots/_template.json dist/DicePP/config/bots/_template.json

          $versionLine = (Get-Content pyproject.toml | Select-String '^version =').Line
          $version = [regex]::Match($versionLine, '"([^"\r\n]+)"').Groups[1].Value
          $expectedBot = "DicePP v$version"
          $actualBot = (& dist/DicePP/DicePP.exe --version).Trim()
          if ($actualBot -ne $expectedBot) {
            throw "Bot version mismatch: expected '$expectedBot', got '$actualBot'"
          }
          & dist/DicePP/DicePP.exe --smoke-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $expectedDashboard = $expectedBot.Replace("DicePP v", "DicePP Dashboard v")
          $actualDashboard = (& dist/DicePP/DicePPDashboard.exe --version).Trim()
          if ($actualDashboard -ne $expectedDashboard) {
            throw "Dashboard version mismatch: expected '$expectedDashboard', got '$actualDashboard'"
          }
          & dist/DicePP/DicePPDashboard.exe --smoke-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows Dashboard UI smoke
        env:
          DICEPP_REQUIRE_PLAYWRIGHT: "1"
          DICEPP_WINDOWS_PACKAGE_SMOKE: "1"
          DICEPP_DASHBOARD_EXE: dist/DicePP/DicePPDashboard.exe
        run: |
          uv run pytest tests/dashboard/test_windows_package_playwright.py --tb=short -q
      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DicePP -DestinationPath DicePP-ci-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dicepp-windows-ci
          path: DicePP-ci-win64.zip
          retention-days: 3

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
      - name: Run coverage
        run: |
          uv run pytest -m "not real_llm" --cov --cov-report=term-missing --cov-report=xml
