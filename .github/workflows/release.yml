# DicePP Release — tag push 触发镜像构建、GHCR 推送和 GitHub Release 创建
#
# 触发: push v*.*.* tag
# 产物: ghcr.io/pear-studio/nonebot-dicepp:vX.Y.Z + :latest
#       GitHub Release（body 来自 docs/releases/vX.Y.Z.md）
#       docker-compose.yml 作为 release asset

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write     # 创建 GitHub Release + 上传 assets
  packages: write     # 推送 GHCR 镜像

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pear-studio/nonebot-dicepp:${{ steps.version.outputs.tag }}
            ghcr.io/pear-studio/nonebot-dicepp:latest
          build-args: |
            DICEPP_IMAGE_TAG=${{ steps.version.outputs.tag }}
            GIT_SHA=${{ steps.version.outputs.sha }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_MD="docs/releases/${{ steps.version.outputs.tag }}.md"
          if [ -f "$RELEASE_MD" ]; then
            gh release create "${{ steps.version.outputs.tag }}" \
              --title "DicePP ${{ steps.version.outputs.tag }}" \
              --notes-file "$RELEASE_MD" \
              docker-compose.yml
          else
            echo "::warning::Release metadata 文件 $RELEASE_MD 不存在，使用默认 body"
            gh release create "${{ steps.version.outputs.tag }}" \
              --title "DicePP ${{ steps.version.outputs.tag }}" \
              --notes "DicePP ${{ steps.version.outputs.tag }}" \
              docker-compose.yml
          fi
