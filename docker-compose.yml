services:
  dicepp:
    image: "${DICEPP_IMAGE:-ghcr.io/pear-studio/nonebot-dicepp:${DICEPP_IMAGE_TAG:-latest}}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: dicepp
    restart: unless-stopped

    networks:
      - dice-net

    ports:
      - "4090:4090"
    # NapCat/LLOneBot connects to ws://dicepp:8080/onebot/v11/ws.
    expose:
      - "8080"

    environment:
      TZ: Asia/Shanghai
      DICEPP_PROJECT_ROOT: /app
      DICEPP_ONEBOT_HOST: 0.0.0.0

    volumes:
      - ./config:/app/config:rw
      - ./data:/app/data:rw
      - ./content:/app/content:rw
      - ./dashboard/data:/app/dashboard/data:rw
      # 保留已有实例的存档物理位置，不迁移旧数据。
      - ./manager/backups:/app/manager/backups:rw

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4090/api/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
        compress: "true"

networks:
  dice-net:
    external: true
